<svg width="100%" viewBox="0 0 920 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>MSMSG Runtime Architecture (FreeRTOS + Modbus + SMS)</title>
  <desc>Updated architecture for current project: SmsTask on core 0, RTUTask TCPTask and ApTask on core 1, shared state, mutexes, and storage/network interfaces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17212b; }
      .title { font-size: 17px; font-weight: 700; }
      .core-title { font-size: 14px; font-weight: 700; }
      .core-sub { font-size: 12px; fill: #37536c; }
      .task-title { font-size: 14px; font-weight: 700; }
      .task-sub { font-size: 12px; fill: #3d4a56; }
      .box-title { font-size: 14px; font-weight: 700; }
      .box-sub { font-size: 12px; fill: #4f5a63; }
      .link { stroke: #6a7178; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .link-soft { stroke: #8b9299; stroke-width: 1.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <text x="460" y="30" text-anchor="middle" class="title">MSMSG Runtime Architecture (Current)</text>

  <rect x="30" y="50" width="410" height="280" rx="14" fill="#e6f6ef" stroke="#158766" stroke-width="1"/>
  <text x="235" y="78" text-anchor="middle" class="core-title" fill="#0f6d52">Core 0</text>
  <text x="235" y="96" text-anchor="middle" class="core-sub">SMS + modem workflow</text>

  <rect x="55" y="120" width="360" height="90" rx="10" fill="#f2effe" stroke="#5c4fc4" stroke-width="1"/>
  <text x="235" y="147" text-anchor="middle" class="task-title" fill="#3f35a8">SmsTask (Modem_task)</text>
  <text x="235" y="167" text-anchor="middle" class="task-sub">Priority 2, pinned core 0</text>
  <text x="235" y="186" text-anchor="middle" class="task-sub">Runs initModem(), scans trigger edges, sends SMS jobs</text>

  <rect x="105" y="235" width="260" height="70" rx="10" fill="#fdeee8" stroke="#b75a36" stroke-width="1"/>
  <text x="235" y="262" text-anchor="middle" class="box-title" fill="#8b3d20">SMS Queue</text>
  <text x="235" y="282" text-anchor="middle" class="box-sub">depth 16, SmsJob (messageIndex)</text>

  <rect x="480" y="50" width="410" height="330" rx="14" fill="#eaf2fc" stroke="#2e78be" stroke-width="1"/>
  <text x="685" y="78" text-anchor="middle" class="core-title" fill="#1f629d">Core 1</text>
  <text x="685" y="96" text-anchor="middle" class="core-sub">Modbus + Web config services</text>

  <rect x="505" y="120" width="360" height="72" rx="10" fill="#f2effe" stroke="#5c4fc4" stroke-width="1"/>
  <text x="685" y="145" text-anchor="middle" class="task-title" fill="#3f35a8">RTUTask (RTU_taskLoop)</text>
  <text x="685" y="165" text-anchor="middle" class="task-sub">Priority 3, Modbus RTU master interactions + syncFrom/syncTo</text>

  <rect x="505" y="205" width="360" height="72" rx="10" fill="#f2effe" stroke="#5c4fc4" stroke-width="1"/>
  <text x="685" y="230" text-anchor="middle" class="task-title" fill="#3f35a8">TCPTask (TCP_taskLoop)</text>
  <text x="685" y="250" text-anchor="middle" class="task-sub">Priority 2, W5500 Ethernet + Modbus TCP + syncFrom/syncTo</text>

  <rect x="505" y="290" width="360" height="72" rx="10" fill="#f2effe" stroke="#5c4fc4" stroke-width="1"/>
  <text x="685" y="315" text-anchor="middle" class="task-title" fill="#3f35a8">ApTask (AP_taskLoop)</text>
  <text x="685" y="335" text-anchor="middle" class="task-sub">Priority 1, Web UI, AP toggle (GPIO 33), CSV/config upload</text>

  <rect x="220" y="400" width="480" height="82" rx="10" fill="#f7f4ea" stroke="#8f8570" stroke-width="1"/>
  <text x="460" y="428" text-anchor="middle" class="box-title" fill="#6e6450">Shared State (Shared.cpp)</text>
  <text x="460" y="447" text-anchor="middle" class="box-sub">triggerRegs, resultRegs, inputRegs, message configs, gateway settings</text>
  <text x="460" y="466" text-anchor="middle" class="box-sub">RTU/TCP per-stack lastSeen arrays prevent clobber races</text>

  <rect x="90" y="515" width="220" height="64" rx="10" fill="#fef3d8" stroke="#b98926" stroke-width="1"/>
  <text x="200" y="540" text-anchor="middle" class="box-title" fill="#8c6519">stateMutex</text>
  <text x="200" y="560" text-anchor="middle" class="box-sub">guards all shared runtime state</text>

  <rect x="330" y="515" width="260" height="64" rx="10" fill="#fef3d8" stroke="#b98926" stroke-width="1"/>
  <text x="460" y="540" text-anchor="middle" class="box-title" fill="#8c6519">filesystemMutex</text>
  <text x="460" y="560" text-anchor="middle" class="box-sub">guards LittleFS read/write operations</text>

  <rect x="610" y="515" width="250" height="64" rx="10" fill="#eef8e2" stroke="#6e9a2b" stroke-width="1"/>
  <text x="735" y="540" text-anchor="middle" class="box-title" fill="#50751f">LittleFS</text>
  <text x="735" y="560" text-anchor="middle" class="box-sub">MBmapconf.csv, gateway.conf, auth files</text>

  <rect x="30" y="350" width="180" height="44" rx="8" fill="#ffffff" stroke="#6ca2d6" stroke-width="1"/>
  <text x="120" y="377" text-anchor="middle" class="box-sub">4G Modem (EC200U)</text>

  <rect x="710" y="400" width="180" height="44" rx="8" fill="#ffffff" stroke="#6ca2d6" stroke-width="1"/>
  <text x="800" y="427" text-anchor="middle" class="box-sub">Modbus RTU (Serial2)</text>

  <rect x="710" y="452" width="180" height="44" rx="8" fill="#ffffff" stroke="#6ca2d6" stroke-width="1"/>
  <text x="800" y="479" text-anchor="middle" class="box-sub">W5500 + Modbus TCP</text>

  <line x1="235" y1="210" x2="235" y2="235" class="link"/>
  <line x1="365" y1="270" x2="460" y2="400" class="link"/>
  <line x1="685" y1="192" x2="560" y2="400" class="link"/>
  <line x1="685" y1="277" x2="610" y2="400" class="link"/>
  <line x1="685" y1="362" x2="660" y2="400" class="link"/>

  <line x1="420" y1="482" x2="240" y2="515" class="link-soft"/>
  <line x1="460" y1="482" x2="460" y2="515" class="link-soft"/>
  <line x1="500" y1="482" x2="690" y2="515" class="link-soft"/>

  <line x1="145" y1="350" x2="200" y2="210" class="link-soft"/>
  <line x1="800" y1="400" x2="800" y2="192" class="link-soft"/>
  <line x1="800" y1="452" x2="800" y2="277" class="link-soft"/>
</svg>
